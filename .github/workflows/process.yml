name: Process Douyin (zsks-runner)

# 重活执行层：由 zsks 应用通过 repository_dispatch 触发，公开库跑无限免费 Actions
on:
  repository_dispatch:
    types: [process]
  workflow_dispatch:
    inputs:
      url:
        description: "抖音视频链接"
        required: true

concurrency:
  group: dy-${{ github.run_id }}

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_ENDPOINT: https://hf-mirror.com
      WHISPER_MODEL: ${{ secrets.WHISPER_MODEL || 'small' }}
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
      WORKER_URL: ${{ secrets.WORKER_URL }}
      DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 ffmpeg 与 faster-whisper（语音转写依赖）
        run: |
          which ffmpeg || sudo apt-get update -y && sudo apt-get install -y ffmpeg
          pip install --quiet faster-whisper

      - name: 取 DeepSeek key（仅 job_id / 状态，不打印内容）
        id: cfg
        run: |
          echo "job_id=${{ github.event.client_payload.job_id }}" >> "$GITHUB_OUTPUT"
          echo "video_url=${{ github.event.client_payload.url }}" >> "$GITHUB_OUTPUT"
          RESP=$(curl -s -H "Authorization: Bearer $INGEST_TOKEN" "$WORKER_URL/api/internal/config?k=deepseek_api_key")
          KEY=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('value',''))")
          echo "::add-mask::$KEY"
          echo "deepseek_key=$KEY" >> "$GITHUB_OUTPUT"

      - name: 运行消化脚本（解析→抓文案→下载→转写→结构化→回调共享库）
        env:
          JOB_ID: ${{ steps.cfg.outputs.job_id }}
          VIDEO_URL: ${{ steps.cfg.outputs.video_url }}
          DEEPSEEK_KEY: ${{ steps.cfg.outputs.deepseek_key }}
        run: python3 scripts/structure.py
