name: Deploy Pages

# 用 Secrets 里有效的 CF_API_TOKEN 把前端（public/ + functions/）部署到 Cloudflare Pages
# 绑定来自 wrangler.toml：D1=DB、R2=BUCKET
# submit.js 需要的 GH_REPO / GH_TOKEN 通过 --var 注入
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: 部署到 Cloudflare Pages
        run: |
          npx --yes wrangler pages deploy public \
            --project-name douyin-kb \
            --commit-dirty \
            --var GH_REPO:3586632844/douyin-kb \
            --var GH_TOKEN:${{ secrets.GH_PAT }}
