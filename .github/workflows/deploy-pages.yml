name: Deploy Pages

# 用 Secrets 里有效的 CF_API_TOKEN 把前端（public/ + functions/）部署到 Cloudflare Pages
# 绑定来自 wrangler.toml：D1=DB、R2=BUCKET
# submit.js 需要的 GH_REPO / GH_TOKEN 通过 --var 注入
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: 创建 Pages 项目（若不存在，用 Cloudflare REST API 避免交互）
        run: |
          curl -s -o /dev/null -w "create_http=%{http_code}\n" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"douyin-kb","production_branch":"main"}' || true

      - name: 部署到 Cloudflare Pages
        run: npx --yes wrangler pages deploy public --project-name douyin-kb --commit-dirty

      - name: 注入 GH_TOKEN（机密，供 submit.js 触发流水线）
        run: echo "${{ secrets.GH_PAT }}" | npx --yes wrangler pages secret put GH_TOKEN --project-name douyin-kb
