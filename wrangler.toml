name = "douyin-kb"
pages_build_output_dir = "public"
compatibility_date = "2024-09-01"

# D1 数据库绑定（前端按时间/主题查询用）
[[d1_databases]]
binding = "DB"
database_name = "douyin_kb"
database_id = "af6af004-9729-455c-8180-e736560c67d3"

# R2 存储桶绑定（存放转写稿/总结/结构）
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "douyin-kb"

# Pages Functions 非机密环境变量（GH_TOKEN 为机密，用 `wrangler pages secret put` 注入）
[vars]
GH_REPO = "3586632844/douyin-kb"
