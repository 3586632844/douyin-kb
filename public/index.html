<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>抖音口播知识库</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --fg:#e6e8eb; --muted:#9aa0a8; --acc:#4f8cff; --line:#2a2e37; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--fg); line-height:1.6; }
  header { padding:24px 20px 12px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 4px; font-size:20px; }
  .sub { color:var(--muted); font-size:13px; }
  .wrap { max-width:880px; margin:0 auto; padding:20px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  input,button,select { background:var(--card); color:var(--fg); border:1px solid var(--line);
        border-radius:8px; padding:9px 12px; font-size:14px; }
  input[type=url] { flex:1; min-width:240px; }
  button { cursor:pointer; background:var(--acc); border-color:var(--acc); color:#fff; }
  button.sec { background:var(--card); color:var(--fg); border-color:var(--line); }
  .list { display:flex; flex-direction:column; gap:12px; }
  .item { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; cursor:pointer; }
  .item:hover { border-color:var(--acc); }
  .item h3 { margin:0 0 6px; font-size:16px; }
  .meta { color:var(--muted); font-size:12px; display:flex; gap:12px; flex-wrap:wrap; }
  .tag { background:#243049; color:#9ec1ff; padding:1px 8px; border-radius:999px; font-size:12px; }
  .summary { color:#c7ccd3; font-size:14px; margin-top:8px; }
  .kw { color:var(--muted); font-size:12px; margin-top:6px; }
  #detail { display:none; position:fixed; inset:0; background:#0b0d10ee; overflow:auto; padding:32px 16px; }
  #detail .box { max-width:820px; margin:0 auto; background:var(--card); border:1px solid var(--line);
        border-radius:12px; padding:24px; }
  #detail pre { white-space:pre-wrap; word-break:break-word; font-size:14px; }
  .close { float:right; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#222; border:1px solid var(--line);
        padding:10px 16px; border-radius:10px; font-size:14px; display:none; }
  .empty { color:var(--muted); text-align:center; padding:40px; }
</style>
</head>
<body>
<header><div class="wrap" style="padding-bottom:0">
  <h1>抖音口播知识库</h1>
  <div class="sub">粘贴抖音链接 → 自动下载/转写/结构化 → 按时间或主题检索</div>
</div></header>

<div class="wrap">
  <div class="bar">
    <input id="url" type="url" placeholder="粘贴抖音分享链接，如 https://v.douyin.com/xxxx/" />
    <button id="submit">提交处理</button>
    <input id="topic" placeholder="按主题筛选（可空）" style="min-width:160px" />
    <select id="sort">
      <option value="desc">最新优先</option>
      <option value="asc">最早优先</option>
    </select>
    <button class="sec" id="refresh">刷新</button>
  </div>
  <div id="list" class="list"><div class="empty">加载中…</div></div>
</div>

<div id="detail"><div class="box">
  <button class="sec close" onclick="closeDetail()">关闭</button>
  <div id="detailBody"></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',2600); }

async function load(){
  const topic = $('#topic').value.trim();
  const sort = $('#sort').value;
  let url = '/api/list' + (topic ? '?topic=' + encodeURIComponent(topic) : '');
  const r = await fetch(url); const items = await r.json();
  items.sort((a,b)=> sort==='asc' ? a.created_at-b.created_at : b.created_at-a.created_at);
  const box = $('#list');
  if(!items.length){ box.innerHTML='<div class="empty">暂无内容，提交一条链接试试。</div>'; return; }
  box.innerHTML = items.map(it=>{
    const d = new Date((it.created_at||0)*1000);
    const date = isNaN(d)?'':d.toLocaleString('zh-CN');
    const kw = (it.keywords||[]).slice(0,6).join('、');
    return `<div class="item" data-id="${it.id}">
      <h3>${esc(it.title||'未命名')}</h3>
      <div class="meta"><span class="tag">${esc(it.topic||'未分类')}</span>
        <span>${date}</span><span>${Math.floor((it.duration||0)/60)}分${(it.duration||0)%60}秒</span>
        <span>约${it.words||0}字</span></div>
      <div class="summary">${esc((it.summary||'').slice(0,120))}${(it.summary||'').length>120?'…':''}</div>
      <div class="kw">关键词：${esc(kw)}</div>
    </div>`;
  }).join('');
  document.querySelectorAll('.item').forEach(el=>el.onclick=()=>view(el.dataset.id));
}
function esc(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

async function view(id){
  const r = await fetch('/api/view?id='+id);
  if(!r.ok){ toast('读取失败'); return; }
  const md = await r.text();
  $('#detailBody').innerHTML = renderMarkdown(md);
  $('#detail').style.display='block';
}
function closeDetail(){ $('#detail').style.display='none'; }

// 极简 markdown 渲染（标题/列表/加粗/代码块）
function renderMarkdown(md){
  const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const lines = md.split('\n'); let html='', inCode=false;
  for(let l of lines){
    if(l.startsWith('```')){ if(inCode){html+='</pre>';inCode=false;}else{html+='<pre>';inCode=true;} continue; }
    if(inCode){ html+=esc(l)+'\n'; continue; }
    let t=esc(l);
    t=t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    if(/^# /.test(l)) html+=`<h2>${t.slice(2)}</h2>`;
    else if(/^## /.test(l)) html+=`<h3 style="color:#9ec1ff">${t.slice(3)}</h3>`;
    else if(/^\s*[-]\s/.test(l)) html+=`<div style="margin-left:16px">• ${t.replace(/^\s*[-]\s/,'')}</div>`;
    else if(/^\d+\.\s/.test(l)) html+=`<div style="margin-left:16px">${t}</div>`;
    else if(t.trim()==='') html+='<br/>';
    else html+=`<p>${t}</p>`;
  }
  return html;
}

$('#submit').onclick = async ()=>{
  const url = $('#url').value.trim();
  if(!url){ toast('请先粘贴链接'); return; }
  $('#submit').disabled=true;
  const r = await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
  const j = await r.json().catch(()=>({}));
  $('#submit').disabled=false;
  toast(j.message || j.error || (r.ok?'已提交':'提交失败'));
  if(r.ok){ $('#url').value=''; setTimeout(load, 180000); }
};
$('#refresh').onclick=load;
$('#topic').addEventListener('input', ()=>setTimeout(load,400));
$('#sort').onchange=load;
load();
</script>
</body>
</html>
